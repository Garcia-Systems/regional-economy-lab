[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regional-economy-lab"
version = "0.4.0"
description = "Deterministic executable textbook for learning regional economic flows and scenario accounting"
readme = "README.md"
requires-python = ">=3.13"
license = {file = "LICENSE"}
keywords = ["education", "economics", "simulation", "regional-economy", "executable-textbook"]
classifiers = ["Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.13"]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.urls]
Homepage = "https://github.com/garcia-systems/regional-economy-lab"
Repository = "https://github.com/garcia-systems/regional-economy-lab"
Changelog = "https://github.com/garcia-systems/regional-economy-lab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
regional-sim = "regional_economy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regional_economy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
